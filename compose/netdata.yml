name: netdata

services:
  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    ports:
      # Tailnet only. Empty TS_IP = Compose refuses to start.
      - "${TS_IP:?run via update-all.sh or set TS_IP}:19999:19999"
    cap_add:
      - SYS_PTRACE          # required to read host process metrics
    security_opt:
      - apparmor=unconfined # accepted: tailnet-only, observability layer
    pid: host
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  netdata_config:
    external: true
    name: netdata_config
  netdata_lib:
    external: true
    name: netdata_lib
  netdata_cache:
    external: true
    name: netdata_cache
