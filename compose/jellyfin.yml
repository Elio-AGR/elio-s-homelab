name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: always
    ports:
      - "${LAN_BIND:-0.0.0.0}:8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${MEDIA_DIR:-/srv/media}:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  jellyfin_config:
    external: true
    name: jellyfin_config
  jellyfin_cache:
    external: true
    name: jellyfin_cache
