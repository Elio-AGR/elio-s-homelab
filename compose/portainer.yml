name: portainer

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "${TS_IP:?set TS_IP}:9000:9000"
    volumes:
      # Read-write because Portainer must manage stacks. Tailnet-only is the control.
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
    external: true
    name: portainer_data
